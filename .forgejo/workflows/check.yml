name: check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pierdol-playtime-paper
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: pierdol-playtime-paper
      # No immutable Auth revision is available in inspected local source metadata.
      # Keep the existing checkout convention; Auth uses its default branch.
      - name: Check out Auth sibling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: scclie/pierdol-auth-paper
          path: pierdol-auth-paper
      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Fetch verified FastLogin compile-only JAR
        run: |
          python3 ../pierdol-auth-paper/scripts/fetch-fastlogin-jar.py \
            --url 'https://api.spiget.org/v2/resources/134322/download?version=636152' \
            --sri-sha256 'sha256-sxVoz7e4gVCQ2ewDT5z315oue5HPZlAFy7/G7XCEDOs=' \
            --output "${RUNNER_TEMP}/FastLogin.jar"
      - name: Compile and package plugin
        env:
          FASTLOGIN_JAR: ${{ runner.temp }}/FastLogin.jar
        run: ./gradlew --no-daemon clean :assemble
